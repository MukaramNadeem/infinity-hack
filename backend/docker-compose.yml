services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: novaworks
      POSTGRES_PASSWORD: novaworks
      POSTGRES_DB: novaworks
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaworks -d novaworks"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
