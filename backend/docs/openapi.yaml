openapi: 3.0.3
info:
  title: NovaWorks PM CRM API
  version: 1.0.0
  description: |
    Backend for the NovaWorks Technologies project-management CRM.

    **Authentication.** `POST /auth/login` returns a JWT. Send it on every other request as
    `Authorization: Bearer <token>`. Users are pre-seeded (no signup); every demo account's password is `Demo123!`.

    **Roles and visibility** (enforced on every request, not only in the UI):

    | Role | Projects | Tasks |
    |---|---|---|
    | ADMIN | all | all |
    | MANAGER | projects they manage | all tasks in those projects |
    | DEVELOPER | projects containing at least one of their tasks | only tasks assigned to them |

    A project or task outside the caller's scope returns **404** (not 403), so its existence is not revealed.
    For developers, a project's `taskCount`, `totalEstimatedHours`, `members` and `tasks` only cover their own tasks.

    **Dates** are calendar dates exchanged as `YYYY-MM-DD`.

    **Errors** always use the envelope `{ "error": { "code", "message", "details"? } }`.
    Validation errors (`400 VALIDATION_ERROR`) list every problem as `details: [{ path, message }]`.

    **Create from Transcript.** The admin posts a meeting transcript; the AI extracts projects and tasks using the
    team directory, the server validates everything, and saves it in one transaction (all or nothing).
    If something can't be resolved (unknown person, missing date, …) the response is `422 DRAFT_INVALID` with the
    draft and a list of issues: show them, let the admin fix the draft, then send it to `POST /transcripts/commit`.
# Shared example values, reused below with YAML aliases (*Name). Ignored by OpenAPI tools (x- extension).
